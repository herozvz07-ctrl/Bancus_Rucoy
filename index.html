<script>
async function runRucoySearch() {
    const name = document.getElementById('search-input').value.trim();
    const type = document.getElementById('search-type').value;
    const box  = document.getElementById('search-results');
    if (!name) { alert('Введите имя!'); return; }
    box.style.display = 'block';
    box.innerHTML = `<div class="player-card-result"><div class="loading-spinner"><i class="fas fa-circle-notch fa-spin fa-2x"></i><br><br>SEARCHING...</div></div>`;
    try {
        const r = await fetch(`https://telegram-bot-2-mgnk.onrender.com/api/search?name=${encodeURIComponent(name)}&type=${type}`);
        const data = await r.json();
        if (data.error) {
            box.innerHTML = `<div class="player-card-result"><div class="result-header"><i class="fas fa-times"></i> ERROR</div><div class="result-body"><p style="color:var(--danger)">${escapeHtml(data.error)}</p></div></div>`;
            return;
        }
        if (data.type === 'player') {
            const onl = data.online?.toLowerCase().includes('online') ? 'is-online' : '';
            box.innerHTML = `
                <div class="player-card-result">
                    <div class="result-header"><i class="fas fa-user-shield"></i> PLAYER PROFILE</div>
                    <div class="result-body">
                        <h3>${escapeHtml(data.name)}</h3>
                        <div class="stat-row"><span class="stat-label"><i class="fas fa-fist-raised"></i> Level</span><span class="stat-value">${escapeHtml(data.level)}</span></div>
                        <div class="stat-row"><span class="stat-label"><i class="fas fa-users"></i> Guild</span><span class="stat-value">${data.guild !== 'None' ? escapeHtml(data.guild) : '—'}</span></div>
                        <div class="stat-row"><span class="stat-label"><i class="fas fa-clock"></i> Last online</span><span class="stat-value ${onl}">${escapeHtml(data.online)}</span></div>
                        ${data.born ? `<div class="stat-row"><span class="stat-label"><i class="fas fa-baby"></i> Born</span><span class="stat-value">${escapeHtml(data.born)}</span></div>` : ''}
                        <a href="${escapeHtml(data.url)}" target="_blank" rel="noopener noreferrer" class="btn-link"><i class="fas fa-external-link-alt"></i> VIEW PROFILE</a>
                    </div>
                </div>`;
        } else {
            box.innerHTML = `
                <div class="player-card-result">
                    <div class="result-header"><i class="fas fa-fort-awesome"></i> GUILD INFO</div>
                    <div class="result-body">
                        <h3>${escapeHtml(data.name)}</h3>
                        <div class="stat-row"><span class="stat-label"><i class="fas fa-users"></i> Members</span><span class="stat-value">${escapeHtml(String(data.members))}</span></div>
                        <div class="stat-row"><span class="stat-label"><i class="fas fa-calendar"></i> Founded</span><span class="stat-value">${escapeHtml(data.created_at || '?')}</span></div>
                        ${data.description && data.description !== 'Нет описания' ? `<div class="stat-row" style="flex-direction:column;align-items:flex-start"><span class="stat-label"><i class="fas fa-scroll"></i> Description</span><span class="stat-value" style="margin-top:5px;font-style:italic;color:#ddd">${escapeHtml(data.description)}</span></div>` : ''}
                        <a href="${escapeHtml(data.url)}" target="_blank" rel="noopener noreferrer" class="btn-link"><i class="fas fa-chess-rook"></i> VIEW GUILD</a>
                    </div>
                </div>`;
        }
    } catch(err) {
        box.innerHTML = `<div class="player-card-result"><div class="result-header"><i class="fas fa-times"></i> ERROR</div><div class="result-body"><p style="color:var(--danger)">Сервер не отвечает. Попробуйте позже.</p></div></div>`;
    }
}
</script>
